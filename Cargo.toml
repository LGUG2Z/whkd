[package]
name = "whkd"
description = "A simple hotkey daemon for Windows"
version.workspace = true
repository.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["core", "keys", "parser", "xtask"]

[workspace.package]
version = "0.2.10"
repository = "https://github.com/LGUG2Z/whkd"
edition = "2021"

[workspace.dependencies]
whkd-core = { version = "0.2.8", path = "core" }
whkd-keys = { path = "keys" }
whkd-parser = { version = "0.2.8", path = "parser" }
active-win-pos-rs = "0.11"
ariadne = "0.6"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
dirs = "7"
lazy_static = "1"
parking_lot = "0.12"
uds_windows = "1"
win-hotkeys = "0.5"
windows = { version = "0.62", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dependencies]
whkd-core.workspace = true
whkd-keys.workspace = true
whkd-parser.workspace = true
active-win-pos-rs.workspace = true
clap.workspace = true
color-eyre.workspace = true
dirs.workspace = true
lazy_static.workspace = true
parking_lot.workspace = true
uds_windows.workspace = true
win-hotkeys.workspace = true
windows.workspace = true
